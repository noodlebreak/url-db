<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

  --blue-50: #E6F1FB; --blue-100: #B5D4F4; --blue-200: #85B7EB;

.sticky-header { position: sticky; top: 0; z-index: 40; background: var(--color-background-primary, #fff); padding-top: 2rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--blue-100); margin-bottom: 1rem; }

#content-input { flex: 1; padding: 10px 14px; font-size: 14px; border: 1px solid var(--blue-200); border-radius: 8px; background: var(--color-background-primary); color: var(--color-text-primary); outline: none; transition: border-color 0.15s; resize: both; min-height: 42px; max-height: 200px; font-family: inherit; field-sizing: content; }
#content-input:focus { border-color: var(--blue-400); }
#content-input::placeholder { color: var(--color-text-tertiary); }
.btn { padding: 10px 18px; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 8px; border: 1px solid var(--blue-600); background: var(--blue-600); color: #fff; transition: background 0.15s; white-space: nowrap; }
.btn:hover { background: var(--blue-800); border-color: var(--blue-800); }
.btn:active { transform: scale(0.98); }
.btn-outline { background: transparent; color: var(--blue-600); border: 1px solid var(--blue-200); }
.btn-outline:hover { background: var(--blue-50); border-color: var(--blue-400); }

<div id="app">

<script>
const MAX_BYTES = 2 * 1024 * 1024;
let items = [];
let schemeMap = {};
let currentlyEncrypted = false;
let listFilterQuery = '';
let listSort = 'newest';
let listTypeFilter = 'all';

function getFilteredSortedRows() {
  const q = listFilterQuery.trim().toLowerCase();
  let rows = items.map((item, index) => ({ index, item }));
  if (listTypeFilter === 'url') rows = rows.filter((r) => isUrl(r.item[0]));
  else if (listTypeFilter === 'text') rows = rows.filter((r) => !isUrl(r.item[0]));
  if (q) rows = rows.filter((r) => r.item[0].toLowerCase().includes(q));
  rows.sort((a, b) => {
    const [ca, ta] = a.item;
    const [cb, tb] = b.item;
    const na = parseInt(ta, 36);
    const nb = parseInt(tb, 36);
    switch (listSort) {
      case 'newest': return nb - na;
      case 'oldest': return na - nb;
      case 'az': return ca.localeCompare(cb, undefined, { sensitivity: 'base' });
      case 'za': return cb.localeCompare(ca, undefined, { sensitivity: 'base' });
      case 'short': return ca.length - cb.length;
      case 'long': return cb.length - ca.length;
      default: return 0;
    }
  });
  return rows;
}

function syncFilterControls() {
  const fi = document.getElementById('list-filter');
  const st = document.getElementById('list-sort');
  const ty = document.getElementById('list-type');
  if (fi && document.activeElement !== fi) fi.value = listFilterQuery;
  if (st) st.value = listSort;
  if (ty) ty.value = listTypeFilter;
}

function setListFilter(v) {
  listFilterQuery = v;
  render();
}

function setListSort(v) {
  listSort = v;
  render();
}

function setListTypeFilter(v) {
  listTypeFilter = v;
  render();
}

function resetListFilters() {
  listFilterQuery = '';
  listSort = 'newest';
  listTypeFilter = 'all';
}

function isUrl(str) {
  try { new URL('https://' + str); return str.includes('.') && !str.includes(' '); }
  catch { return false; }
}
function stripScheme(str) { return str.replace(/^https?:\/\//i, ''); }
function b36ts() { return Math.floor(Date.now() / 1000).toString(36); }
function b36toDate(b36) {
  const d = new Date(parseInt(b36, 36) * 1000);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(-2)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function lzEncode(data) { return LZString.compressToEncodedURIComponent(JSON.stringify(data)); }
function lzDecode(str) { try { return JSON.parse(LZString.decompressFromEncodedURIComponent(str)); } catch { return null; } }

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

function bufToB64(buf) {
  const bytes = new Uint8Array(buf);
  let str = '';
  for (let i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64ToBuf(b64) {
  const s = b64.replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}

async function encryptPayload(password, data) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder();
  const plaintext = JSON.stringify(data);
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(plaintext));
  const saltB64 = bufToB64(salt);
  const ivB64 = bufToB64(iv);
  const ctB64 = bufToB64(ciphertext);
  return `v2.${saltB64}.${ivB64}.${ctB64}`;
}

async function decryptPayload(password, hash) {
  try {
    const parts = hash.split('.');
    if (parts.length !== 4 || parts[0] !== 'v2') {
      return null;
    }
    const salt = b64ToBuf(parts[1]);
    const iv = b64ToBuf(parts[2]);
    const ciphertext = b64ToBuf(parts[3]);
    const key = await deriveKey(password, salt);
    const dec = new TextDecoder();
    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
    return JSON.parse(dec.decode(decrypted));
  } catch(e) {
    return null;
  }
}

function getPayload() { return { v: 1, i: items }; }

function updateHash(compressed) {
  history.replaceState(null, '', compressed ? '#' + compressed : window.location.pathname);
  updateSizeBar(compressed || '');
}

function updateSizeBar(str) {
  const bytes = new Blob([str]).size;
  const pct = Math.min((bytes / MAX_BYTES) * 100, 100);
  document.getElementById('size-fill').style.width = pct + '%';
  document.getElementById('size-label').textContent = formatBytes(bytes);
  updateStats();
}

function updateStats() {
  const count = items.length;
  const avg = count ? Math.round(items.reduce((s, i) => s + i[0].length, 0) / count) : 0;
  document.getElementById('items-count').textContent = count;
  document.getElementById('avg-length').textContent = avg;
}

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/(1024*1024)).toFixed(2) + ' MB';
}

function addItem() {
  const input = document.getElementById('content-input');
  const raw = input.value.trim();
  if (!raw) return;
  items.push([isUrl(raw) ? stripScheme(raw) : raw, b36ts()]);
  input.value = '';
  const compressed = lzEncode(getPayload());
  updateHash(compressed);
  render();
  input.focus();
}

function clearAll() {
  if (!items.length) return;
  items = []; schemeMap = {}; currentlyEncrypted = false;
  resetListFilters();
  updateHash(''); renderBadge(); render();
}

function toggleScheme(idx) {
  schemeMap[idx] = schemeMap[idx] === 'http' ? 'https' : 'http';
  render();
}

function deleteItem(idx) {
  items.splice(idx, 1);
  delete schemeMap[idx];
  const newMap = {};
  Object.keys(schemeMap).forEach(k => {
    const ki = parseInt(k);
    if (ki > idx) newMap[ki - 1] = schemeMap[k];
    else if (ki < idx) newMap[ki] = schemeMap[k];
  });
  schemeMap = newMap;
  const compressed = items.length ? lzEncode(getPayload()) : '';
  updateHash(compressed);
  render();
}

function startEdit(idx) {
  const area = document.getElementById('edit-area-' + idx);
  if (area.innerHTML) { area.innerHTML = ''; return; }
  const val = items[idx][0].replace(/"/g, '&quot;');
  area.innerHTML = `<div class="item-edit-row">
    <textarea class="item-edit-input" id="edit-input-${idx}">${val}</textarea>
    <button class="item-edit-btn save" onclick="saveEdit(${idx})">save</button>
    <button class="item-edit-btn" onclick="cancelEdit(${idx})">cancel</button>
  </div>`;
  const inp = document.getElementById('edit-input-' + idx);
  inp.focus();
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(idx); }
    if (e.key === 'Escape') cancelEdit(idx);
  });
}

function saveEdit(idx) {
  const inp = document.getElementById('edit-input-' + idx);
  const val = inp.value.trim();
  if (!val) return;
  items[idx][0] = isUrl(val) ? stripScheme(val) : val;
  const compressed = lzEncode(getPayload());
  updateHash(compressed);
  render();
}

function cancelEdit(idx) {
  const area = document.getElementById('edit-area-' + idx);
  if (area) area.innerHTML = '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function openAboutModal() {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal about-modal">
        <h2>about urlDB</h2>
        <div class="about-modal-body">
          <p>a bare-bones link &amp; text sharing app with <strong>no backend</strong>. your data is compressed and encoded directly into the URL itself — the URL <em>is</em> the database.</p>
          <h3>Why</h3>
          <p>I just wanted to create something nice over the weekend. Wanted to create something that could be shipped, be useful, at least to me.</p>
          <p>Don't exactly remember how I landed on the idea but I had searched in google if URL has a limit. Turns out it didn't.<br />So I wanted to build something off taking advantage of that.</p>
          <p>I have already built a tonne of todo/note/project management etc apps but I always get a headache when we have to connect them to a DB - means we have to pay for it ultimately and manage it and it's just... extra burden in maintaining a project for simple needs</p>
          <p>I wanted something where I can just take the data with me and still access it nicely formatted with full application features.</p>
          <p style="margin-bottom:8px;"><strong>urlDB can do this:</strong></p>
          <ul>
            <li>data is in the URL, so you don't have to "sync" between devices - just open the copied url anywhere - you'll get all your data no problems. and with security</li>
            <li>no login no signup required - small simple apps requiring these are instant turn off for me</li>
            <li>no trackers - as of yet - I do plan to add some to see how people are using it - won't hurt your privacy</li>
            <li>your data is secure if the algo encrypting is secure and you believe it</li>
            <li>simple, aesthetic (yeah I know it's subjective), easy to use, and fast loading - no unnecessary dependencies except lz-string</li>
          </ul>
          <p>So I made this. And I'm happy I made it - something feature complete to be completely useful - although I will be adding more and more features to this and extend its core concept to more applications.</p>
          <p><strong>how it works:</strong> everything you add gets LZ-compressed and stored in the URL hash. when someone opens that URL, the data is decompressed and displayed. optionally, you can encrypt it with a password using AES-256-GCM.</p>
          <p><strong>why it works:</strong> while a safe URL limit is ~2,000 characters, browsers can technically handle far more. Chrome supports up to 2MB (2,097,152 characters) — enough for ~20,000 short links. there is no strict max length defined by the HTTP protocol itself.</p>
          <p class="about-limits"><strong>limits by platform:</strong> Chrome 2MB, Firefox 65K+, Safari 80K+, Apache ~8K, Cloudflare/Azure 16KB, AWS 8K. your mileage may vary depending on the sharing medium.</p>
          <p style="margin-bottom:0;"><a href="https://github.com/noodlebreak/url-db" target="_blank" rel="noopener" style="color:#185FA5;">view on github</a></p>
        </div>
        <div class="modal-actions" style="margin-top:16px;">
          <button class="modal-btn" onclick="closeModal()">close</button>
        </div>
      </div>
    </div>`;
}

function openCopyModal() {
  if (!items.length) { showToast('nothing to share yet'); return; }
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>copy shareable url</h2>
        <p>how do you want to share your data?</p>
        <div class="modal-option-row">
          <div class="modal-option selected" id="opt-plain" onclick="selectCopyOpt('plain')">
            <div class="modal-option-title">plain</div>
            <div class="modal-option-desc">no password, anyone with the url can view</div>
          </div>
          <div class="modal-option" id="opt-secure" onclick="selectCopyOpt('secure')">
            <div class="modal-option-title">secure</div>
            <div class="modal-option-desc">encrypted, password required to view</div>
          </div>
        </div>
        <div id="pw-field" style="display:none">
          <input class="modal-input" type="password" id="copy-pw" placeholder="enter password…" onkeydown="if(event.key==='Enter')confirmCopy()" />
          <div class="modal-error" id="copy-err"></div>
        </div>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-outline" onclick="closeModal()">cancel</button>
          <button class="modal-btn" onclick="confirmCopy()">copy url</button>
        </div>
      </div>
    </div>`;

  window.selectCopyOpt = (opt) => {
    document.getElementById('opt-plain').className = 'modal-option' + (opt === 'plain' ? ' selected' : '');
    document.getElementById('opt-secure').className = 'modal-option' + (opt === 'secure' ? ' selected' : '');
    document.getElementById('pw-field').style.display = opt === 'secure' ? 'block' : 'none';
    if (opt === 'secure') setTimeout(() => document.getElementById('copy-pw')?.focus(), 50);
  };

  window.confirmCopy = async () => {
    const selected = document.getElementById('opt-secure').classList.contains('selected') ? 'secure' : 'plain';
    if (selected === 'plain') {
      const compressed = lzEncode(getPayload());
      const url = window.location.origin + window.location.pathname + '#' + compressed;
      await navigator.clipboard.writeText(url);
      closeModal(); showToast('plain url copied!');
    } else {
      const pw = document.getElementById('copy-pw').value;
      if (!pw) { document.getElementById('copy-err').textContent = 'please enter a password'; return; }
      const hash = await encryptPayload(pw, getPayload());
      const url = window.location.origin + window.location.pathname + '#' + hash;
      await navigator.clipboard.writeText(url);
      updateHash(hash); currentlyEncrypted = true; renderBadge();
      closeModal(); showToast('secure url copied!');
    }
  };
}

function newDb() {
  items = []; schemeMap = {}; currentlyEncrypted = false;
  resetListFilters();
  history.replaceState(null, '', window.location.pathname);
  closeModal(); render(); updateSizeBar('');
}

function openDecryptModal(hash) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay">
      <div class="modal">
        <h2>this link is encrypted</h2>
        <p>enter the password to view its contents.</p>
        <input class="modal-input" type="password" id="dec-pw" placeholder="enter password…" onkeydown="if(event.key==='Enter')tryDecrypt()" />
        <div class="modal-error" id="dec-err"></div>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-outline" onclick="newDb()" title="discard this url and start fresh">new db</button>
          <button class="modal-btn" onclick="tryDecrypt()">unlock</button>
        </div>
      </div>
    </div>`;

  window.tryDecrypt = async () => {
    const pw = document.getElementById('dec-pw').value;
    const data = await decryptPayload(pw, hash);
    if (!data || !Array.isArray(data.i)) {
      const inp = document.getElementById('dec-pw');
      inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
      document.getElementById('dec-err').textContent = 'incorrect password, try again';
      inp.value = ''; inp.focus();
      return;
    }
    items = data.i; currentlyEncrypted = true;
    updateSizeBar(lzEncode(getPayload()));
    closeModal(); renderBadge(); render();
  };
  setTimeout(() => document.getElementById('dec-pw')?.focus(), 50);
}

function renderBadge() {
  document.getElementById('encrypted-badge-wrap').innerHTML = currentlyEncrypted
    ? `<div class="encrypted-badge"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#185FA5" stroke-width="2"><rect x="3" y="7" width="10" height="8" rx="1"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>loaded from encrypted url</div>`
    : '';
}

function render() {
  const container = document.getElementById('items-container');
  const filterWrap = document.getElementById('filter-bar-wrap');
  if (!items.length) {
    if (filterWrap) filterWrap.classList.add('hidden');
    container.innerHTML = '<div class="empty-state">no items yet — add a link or text above</div>';
    syncFilterControls();
    return;
  }
  if (filterWrap) filterWrap.classList.remove('hidden');
  const rows = getFilteredSortedRows();
  const linkIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="#378ADD" stroke-width="1.5"><path d="M7 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9"/><path d="M10 2h4v4"/><path d="M8 8L14 2"/></svg>`;
  const textIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="#378ADD" stroke-width="1.5"><path d="M2 4h12M2 8h8M2 12h10"/></svg>`;
  const editIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="#185FA5" stroke-width="1.5"><path d="M11.5 2.5l2 2L5 13H3v-2l8.5-8.5z"/></svg>`;
  const deleteIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="#A32D2D" stroke-width="1.5"><path d="M2.5 4h11"/><path d="M5.5 4V2.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5V4"/><path d="M4 4l.7 9.2a1 1 0 0 0 1 .8h4.6a1 1 0 0 0 1-.8L12 4"/><path d="M6.5 7v4M9.5 7v4"/></svg>`;
  if (!rows.length) {
    container.innerHTML = '<div class="empty-state">no items match your filter — try another search or reset the type filter</div>';
    syncFilterControls();
    return;
  }
  container.innerHTML = '<div class="items-list">' + rows.map(({ index: idx, item }) => {
    const [content, ts] = item;
    const url = isUrl(content);
    const scheme = schemeMap[idx] || 'https';
    const mainContent = url
      ? `<a href="${scheme}://${content}" target="_blank" rel="noopener">${content}</a>
         <button class="http-toggle" onclick="toggleScheme(${idx})">${scheme === 'https' ? 'http?' : 'https?'}</button>`
      : `<span>${content}</span>`;
    return `<div class="item-card">
      <div class="item-icon">${url ? linkIcon : textIcon}</div>
      <div class="item-content">
        <div class="item-main">${mainContent}</div>
        <div class="item-meta">${b36toDate(ts)}</div>
        <div class="item-edit-area" id="edit-area-${idx}"></div>
      </div>
      <div class="item-actions">
        <button class="item-action-btn" onclick="startEdit(${idx})" title="edit">${editIcon}</button>
        <button class="item-action-btn delete" onclick="deleteItem(${idx})" title="delete">${deleteIcon}</button>
      </div>
    </div>`;
  }).join('') + '</div>';
  syncFilterControls();
}

async function loadFromHash() {
  const hash = window.location.hash.slice(1);
  if (!hash) { render(); updateStats(); return; }
  if (hash.startsWith('v2.')) {
    openDecryptModal(hash);
  } else {
    const data = lzDecode(hash);
    if (data && data.v === 1 && Array.isArray(data.i)) {
      items = data.i;
      updateSizeBar(lzEncode(getPayload()));
    }
    render();
  }
}

let pendingImportMode = 'plain';

function triggerImport() {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>import file</h2>
        <p>what kind of file are you importing?</p>
        <div class="modal-option-row">
          <div class="modal-option selected" id="opt-plain-import" onclick="selectImportOpt('plain')">
            <div class="modal-option-title">plain text / json</div>
            <div class="modal-option-desc">each line is an item, or a urlDB json export</div>
          </div>
          <div class="modal-option" id="opt-bookmarks-import" onclick="selectImportOpt('bookmarks')">
            <div class="modal-option-title">browser bookmarks</div>
            <div class="modal-option-desc">html export from chrome, firefox, or safari</div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-outline" onclick="closeModal()">cancel</button>
          <button class="modal-btn" onclick="confirmImportType()">choose file</button>
        </div>
      </div>
    </div>`;

  pendingImportMode = 'plain';

  window.selectImportOpt = (opt) => {
    document.getElementById('opt-plain-import').className = 'modal-option' + (opt === 'plain' ? ' selected' : '');
    document.getElementById('opt-bookmarks-import').className = 'modal-option' + (opt === 'bookmarks' ? ' selected' : '');
    pendingImportMode = opt;
  };

  window.confirmImportType = () => {
    closeModal();
    document.getElementById('import-file').value = '';
    document.getElementById('import-file').click();
  };
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const raw = ev.target.result.trim();
    let added = 0;

    if (pendingImportMode === 'bookmarks') {
      const hrefRe = /<A\s[^>]*HREF="([^"]+)"[^>]*>/gi;
      let match;
      const ts = b36ts();
      while ((match = hrefRe.exec(raw)) !== null) {
        let url = match[1];
        if (/^(https?:\/\/)/i.test(url)) {
          items.push([stripScheme(url), ts]);
          added++;
        }
      }
    } else if (file.name.endsWith('.json')) {
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) throw new Error();
        parsed.forEach(entry => {
          if (!entry.content) return;
          const content = isUrl(entry.content) ? stripScheme(entry.content) : entry.content;
          items.push([content, entry._ts || b36ts()]);
          added++;
        });
      } catch { showToast('invalid json file'); return; }
    } else {
      const ts = b36ts();
      raw.split('\n').forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;
        items.push([isUrl(trimmed) ? stripScheme(trimmed) : trimmed, ts]);
        added++;
      });
    }

    if (added) {
      updateHash(lzEncode(getPayload()));
      render();
      showToast(`imported ${added} item${added === 1 ? '' : 's'}`);
    } else {
      showToast('no items found in file');
    }
  };
  reader.readAsText(file);
}

function exportJson() {
  if (!items.length) { showToast('nothing to export'); return; }
  const data = items.map(([content, ts]) => ({
    type: isUrl(content) ? 'url' : 'text',
    content: isUrl(content) ? 'https://' + content : content,
    added: b36toDate(ts),
    _ts: ts
  }));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'urlDB-export.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('exported!');
}

document.getElementById('content-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addItem(); } });
(function bindFilterBar() {
  const fi = document.getElementById('list-filter');
  const st = document.getElementById('list-sort');
  const ty = document.getElementById('list-type');
  if (fi) fi.addEventListener('input', function() { setListFilter(this.value); });
  if (st) st.addEventListener('change', function() { setListSort(this.value); });
  if (ty) ty.addEventListener('change', function() { setListTypeFilter(this.value); });
})();
loadFromHash();
</script>
